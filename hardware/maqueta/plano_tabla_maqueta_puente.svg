<line x1="1174" y1="95" x2="1206" y2="95" stroke="#f2c200" stroke-width="4"/>
<text x="1222" y="100" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Línea central doble amarilla</text>
