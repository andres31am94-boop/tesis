<line x1="1174" y1="125" x2="1206" y2="125" stroke="white" stroke-width="4"/>
<text x="1222" y="130" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Línea de pare: 20 mm antes del cruce</text>
<rect x="1170" y="146" width="40" height="18" fill="none" stroke="#c00000" stroke-width="3" stroke-dasharray="8,4"/>
<text x="1222" y="160" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Lo que ve la cámara a 1 m (102 × 68 cm medido)</text>
<rect x="1170" y="176" width="40" height="18" fill="#1f77b4" fill-opacity="0.25" stroke="#1f77b4" stroke-dasharray="6,4"/>
<text x="1222" y="190" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Zonas de conteo por brazo (solo software, NO se pintan)</text>
<rect x="1180" y="206" width="18" height="18" fill="#111" rx="3"/>
<text x="1222" y="220" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Semáforo (módulo LED) + hueco Ø8 mm para cables</text>
<rect x="1170" y="236" width="40" height="18" fill="none" stroke="#004a99" stroke-dasharray="6,4" stroke-width="2"/>
<text x="1222" y="250" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">ESP32 + protoboard DEBAJO de la tabla</text>
<rect x="1180" y="266" width="18" height="18" fill="#7a4a1a"/>
<text x="1222" y="280" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Poste de la cámara en la acera (borde inferior, fuera de la vista);</text>
<text x="1222" y="310" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">   brazo en diagonal hasta el centro, lente a 1 m sobre la tabla</text>
<text x="1170" y="350" font-size="18" text-anchor="start" fill="#111" font-family="Arial" font-weight="bold">Semáforos (hardware/esp32/conexiones.md)</text>
<text x="1170" y="376" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">S1 Cra 23 sur: D32 / D33 / D25</text>
<text x="1170" y="398" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">S2 Cra 23 norte: D26 / D27 / D13</text>
<text x="1170" y="420" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">S3 Dg 15 oeste: D23 / D22 / D21</text>
<text x="1170" y="442" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">S4 Dg 15 este: D19 / D18 / D17</text>
<text x="1170" y="476" font-size="18" text-anchor="start" fill="#111" font-family="Arial" font-weight="bold">Notas</text>
<text x="1170" y="502" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Tránsito por la derecha (Colombia).</text>
<text x="1170" y="523" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">2 carriles de llegada por brazo, como la red SUMO.</text>
<text x="1170" y="544" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Capacidad estimada por brazo: Cra 23 ≈ 8 carros,</text>
<text x="1170" y="565" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">   Dg 15 ≈ 4 (Hot Wheels de 7 cm + 1,5 cm).</text>
<text x="1170" y="586" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">SIN texto ni dibujos en la tabla (falsos positivos).</text>
<text x="1170" y="607" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Acabado mate (sin barniz brillante).</text>
<text x="1170" y="628" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Semáforos en las aceras, fuera de las zonas.</text>
<text x="1170" y="649" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Poste: 60 mm de margen inferior, fuera de la vista.</text>
<text x="1170" y="670" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Las calles llegan al borde: los carros entran</text>
<text x="1170" y="691" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">   desde fuera de la vista.</text>
<text x="1170" y="712" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">Brazo norte: igual que la red SUMO (41 m de 2 carriles</text>
<text x="1170" y="733" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">   + puente de 1 carril por sentido, 58 m) a 3,7 mm/m.</text>
<text x="1170" y="754" font-size="14" text-anchor="start" fill="#111" font-family="Arial" font-weight="normal">   Capacidad del brazo norte ≈ 4 carros.</text>
</svg>