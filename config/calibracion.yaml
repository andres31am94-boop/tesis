# Calibracion del modelo de SUMO (cada cambio se documenta y se valida con scripts/validar_calibracion.py).
#
# Paso 1 (2026-10-21): modelo de SUBCARRILES para las motos.
#   En la realidad las motos (48-70 % del trafico) van lado a lado y se filtran entre carros.
#   Sin este modelo, SUMO pone una moto detras de otra como si fueran carros, y el cruce
#   atiende ~40 % menos vehiculos de los contados en la Cra 23 (GEH 16-17 en aforo_alto).
#   El modelo de subcarriles divide cada carril (3,2 m) en franjas de "resolucion_lateral_m"
#   para que los vehiculos angostos puedan ocupar posiciones laterales distintas.
subcarriles:
  activo: true
  resolucion_lateral_m: 0.7   # paso 4a: <= ancho de la moto (0.75 m) y divide exacto el carril de 3.5 m
  # Tiempo que un vehiculo puede quedar trabado antes del teleport de SUMO: valor normal de SUMO (300 s), para no alterar
  # las colas de la interseccion principal. (2026-10-27 se probo 120 s y se descarto, decision de los autores: el
  # artefacto se corrige solo donde ocurre, con desatasco_calle18.)
  tiempo_teleport_s: 300

# Atributos extra del tipo de vehiculo "moto" (nombres de atributos de vType en SUMO)
moto:
  # Paso 4a: dimensiones de una moto de trabajo comun en Colombia (Bajaj Boxer CT100: 1965 x 752 mm,
  # ficha tecnica del fabricante). SUMO usa 2.2 x 0.9 m por defecto.
  width: 0.75
  length: 2.0
  minGapLat: 0.3          # separacion lateral minima (m); por defecto 0.6
  latAlignment: arbitrary # la moto puede circular en cualquier posicion lateral del carril

# Paso 2 (2026-10-21): POSICION LATERAL DE ENTRADA de las motos.
#   Diagnostico del paso 1: en aforo_alto el brazo norte tenia espera DENTRO de la red de solo
#   ~26 s pero un retraso de ENTRADA de ~944 s, y en sumo-gui las motos aparecian centradas,
#   una detras de otra. Es decir, el cruce descarga en "fila india" (~1 vehiculo cada 2,2 s de verde).
#   Por defecto SUMO hace entrar a todos los vehiculos por el centro del carril; con "random"
#   cada moto entra en una posicion lateral al azar y puede quedar al lado de otro vehiculo.
moto_flujo:
  departPosLat: random

# Paso 3 (2026-10-21): TRAMOS DE ACCESO aguas arriba de cada brazo.
#   Resultado del paso 2: norte 982 veh/h (GEH 13.1), sur 968 (GEH 15.5); mejoro poco.
#   Diagnostico con results/aforo_alto/tiempos_fijos/semilla_1/series.csv: en cada ciclo la cola
#   del norte se vacia a los ~15 s de verde y la linea de pare queda VACIA los ~40 s restantes,
#   mientras cientos de vehiculos esperan FUERA de la red (retraso de entrada ~800 s).
#   El limite no es la descarga en el cruce sino la INSERCION de vehiculos en un brazo corto.
#   Solucion: prolongar cada brazo con un tramo recto para que la cola se forme dentro de la red.
#   Lo generan scripts/generar_accesos.py y netconvert (sumo/network/acacias_ajustes.netccfg).
accesos:
  activo: true
  longitud_m: 500

# Paso 4b (2026-10-21): resultado del barrido sobre la red del paso 5 (results/calibracion/barrido/).
#   La UNICA variable con efecto consistente fue la posicion lateral del carro: con "right" el norte sube
#   ~+65 veh/h en las 4 combinaciones (GEH 2.5 -> 0.7). La separacion lateral de la moto (0.3/0.1) y el largo
#   del bus (12/9 m) no mostraron efecto claro (diferencias de ~20 veh/h, del orden del azar) -> se dejan en
#   0.3 m y en el valor de SUMO (12 m). Criterio: cambiar solo lo que tiene evidencia (combinacion c05).
#   Interpretacion: con el carro a la derecha queda un espacio continuo a la izquierda por donde las motos avanzan
#   hasta la linea de pare. En campo las motos pasan por ambos lados: es una simplificacion del modelo.
carro:
  latAlignment: right
  # 2026-10-27: un vehiculo DETENIDO no se corre de lado (velocidad lateral maxima parado = 0). Con la cola quieta en el
  # carril unico del puente, SUMO corria a carros y buses hacia un lado para dejar pasar motos, hasta sacarlos 0.4 m del
  # carril; al llegar a un cruce interno de 0.1 m quedaban trabados para siempre (atascos de validacion_dg15 valle s4,
  # aforo_v5 alto s101 y validacion_calle18_continua valle s5: bus.13, lateral offset 0.90 m, left side 3.90 > 3.5 m).
  # Realista: en una fila parada nadie mueve el carro de lado para dar paso a una moto; las motos siguen filtrando por el
  # espacio libre (~1.7 m en un carril de 3.5 m). En movimiento se mantiene el comportamiento de SUMO.
  lcMaxSpeedLatStanding: 0
bus:
  lcMaxSpeedLatStanding: 0      # mismo motivo que en "carro"
camion:
  lcMaxSpeedLatStanding: 0      # mismo motivo que en "carro"

# Pasos 7 y 8 (2026-10-21): COMPORTAMIENTO DEL CONDUCTOR. Resultado final de la calibracion.
#   Barrido (results/calibracion/barrido_conductor): sigma era lo que limitaba al sur (0.5 -> 1203 veh/h; 0.25 -> 1377).
#   Validacion (results/calibracion/validacion_conductor): 5 semillas x 4 escenarios del aforo x 4 brazos.
#   Con sigma 0.25 cumplen GEH < 5 las 80 comparaciones (GEH maximo 3.9, en el sur del aforo alto).
#   Se elige cambiar SOLO sigma (minGap queda en 2.5 m, valor de SUMO): con minGap 1.5 tambien cumple, pero
#   no hay medicion que lo justifique. Se descarta sigma 0 (conductor perfecto, poco realista; produjo una colision).
todos:
  sigma: 0.25   # imperfeccion del conductor (modelo Krauss); valor de SUMO por defecto: 0.5

# 2026-10-27 (decision de los autores): DESATASCO DIRIGIDO en el semaforo de la Calle 18 (src/simulation/desatascador.py).
# Artefacto del modelo de subcarriles: un vehiculo desplazado de lado queda trabado en el cruce interno del semaforo
# (0.1 m) aunque este en verde y no tenga nada adelante. Dato de campo: con el verde de la Calle 18 pasan todos.
# Criterio: en la linea de pare o dentro del cruce, luz de su movimiento en VERDE, nadie adelante a menos de
# distancia_libre_m, quieto segundos_quieto seguidos -> se traslada al inicio del tramo de salida. Solo en la Calle 18.
desatasco_calle18:
  activo: true
  segundos_quieto: 20       # un vehiculo real arranca en 2-3 s con verde y via libre
  distancia_libre_m: 15
