# Interseccion Carrera 23 con Diagonal 15, Acacias (Meta).
# Datos de la red sumo/network/acacias.net.xml (verificados el 2026-10-06).
# Este es el UNICO lugar donde se escriben estos IDs: el codigo los lee de aqui.

semaforo_id: "cluster_12995046887_9702926134"

# Espacio que ocupa un vehiculo en cola (m): largo 5 m + separacion 2.5 m,
# valores por defecto de SUMO para un automovil (vClass passenger).
# Se usa para calcular la capacidad de cada brazo y la "cola relativa".
espacio_por_vehiculo_m: 7.5

# ZONA DE CAMARA (2026-10-21): metros antes de la linea de pare en los que el agente cuenta vehiculos detenidos.
# Igual para todos los brazos: es lo que veria una camara en el cruce (y lo que medira la camara en la maqueta).
# En campo las colas observadas llegan a ~150 m como maximo; una cola mas larga que la zona se ve como "alta".
zona_camara_m: 100

# Brazos de llegada: tramos (edges) de SUMO que forman la ZONA DE MEDICION del brazo y eje al que pertenece.
# La lista va desde la linea de pare hacia atras. El primero es el tramo de llegada original de OSM
# (scripts/generar_accesos.py lo usa para ubicar el acceso). Los tramos de acceso de 500 m NO se miden:
# la zona de medicion es la que veria una camara en el cruce (~110-330 m).
# Desde la calibracion (paso 5) el norte tiene 2 tramos: llegada de 2 carriles + puente de 1 carril.
brazos:
  norte: {edges: ["-642480900", "puente_desde_villavicencio"], eje: "cra23"}
  sur:   {edges: ["807940779"],   eje: "cra23"}
  este:  {edges: ["816899410#0"], eje: "dg15"}
  oeste: {edges: ["44411778#0"],  eje: "dg15"}

# Luces de cada fase. 12 letras = 3 por brazo, en el orden: norte, este, sur, oeste.
# G = verde con prioridad, g = verde cediendo el paso, y = amarillo, r = rojo.
luces:
  verde_dg15:     "rrrGGGrrrGGG"
  amarillo_dg15:  "rrryyyrrryyy"
  verde_cra23:    "GGGrrrGGGrrr"   # paso 5: el sur ya no cede el paso (cada carril sigue por el suyo)
  amarillo_cra23: "yyyrrryyyrrr"
  todo_rojo:      "rrrrrrrrrrrr"
