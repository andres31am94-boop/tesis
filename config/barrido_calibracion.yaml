# Barrido de calibracion: prueba TODAS las combinaciones de los niveles de abajo con el semaforo real
# (tiempos fijos) y calcula el GEH por brazo. Lo usa scripts/barrido_calibracion.py.
# Resultados en results/calibracion/<nombre>/ (cada barrido en su carpeta).
# Barridos anteriores: barrido_4b, barrido_conductor, validacion_conductor (sigma 0.25 elegido).
#
# Paso 9 (2026-10-22): VALIDACION EXTERNA con el aforo del jueves 22-oct (hora pico, simultaneo, en video).
#   Este conteo NO se uso para calibrar nada: si el modelo lo reproduce, generaliza a otro dia de hora pico.
#   El unico "factor" es el valor ya elegido (sigma 0.25), para correr el modelo calibrado tal cual.
nombre: validacion_jueves
escenarios: [aforo_pico_jueves]
semillas: [1, 2, 3, 4, 5]
factores:
  - {tipo: todos, atributo: sigma, niveles: [0.25]}
