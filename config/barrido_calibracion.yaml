# Barrido de calibracion: prueba TODAS las combinaciones de los niveles de abajo con el semaforo real
# (tiempos fijos) y calcula el GEH por brazo. Lo usa scripts/barrido_calibracion.py.
# Resultados en results/calibracion/<nombre>/ (cada barrido en su carpeta).
# Barridos anteriores: barrido_4b (carro/moto/bus), barrido_conductor (sigma x minGap, semilla 1).
#
# Paso 8 (2026-10-21): VALIDACION de las dos candidatas del barrido_conductor que cumplen 4/4 sin usar sigma = 0:
#   c03: sigma 0.25, minGap 2.5 (solo cambia sigma)    c04: sigma 0.25, minGap 1.5
#   Se descarta sigma = 0 (conductor perfecto): no es realista, quita la variabilidad entre conductores y
#   produjo una colision en la union del puente.
#   Validacion: 5 semillas y los 4 escenarios del aforo (medio y valle_manana nunca se habian comparado).
nombre: validacion_conductor
escenarios: [aforo_bajo, aforo_valle_manana, aforo_medio, aforo_alto]
semillas: [1, 2, 3, 4, 5]
factores:
  - {tipo: todos, atributo: sigma, niveles: [0.25]}
  - {tipo: todos, atributo: minGap, niveles: [2.5, 1.5]}
