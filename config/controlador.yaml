# Parametros del control semaforico.
# Actualizado 2026-10-20 con la medicion en campo del semaforo real (ver docs/bitacora.md).
# Verdes y amarillo: MEDIDOS. Todo-rojo: OBSERVADO en campo (asimetrico, ver abajo).
# Notas originales (2026-10-06):
#   - "seguridad": revisar contra el Manual de Senalizacion Vial (Resolucion 1885 de 2015)
#     y contra lo medido en campo; citar la fuente al fijarlos.
#   - "tiempos_fijos": deben COPIAR el semaforo real del cruce cuando se mida con cronometro.
#     Mientras tanto se usan los verdes del programa que genero SUMO (42 s por eje).

# Revision 2026-10-23 contra el Manual de Senalizacion Vial 2024 (cap. 4) y el de 2004 (cap. 7): ver docs/bitacora.md.
seguridad:
  verde_min_s:          # ningun verde puede durar menos (ni por decision del agente), por eje
    # 2026-10-28: Cra 23 = 20 s para que el ciclo minimo sea 20+3+0+15+3+20 = 61 s (Manual 2024 cap. 4: ciclos de 60 a
    # 120 s; con 15 s para ambos ejes podia bajar a 56 s). Las decisiones del agente en la Cra 23 quedan en 20, 25 ... 55 s,
    # alineadas con los 55 s del plan real. El semaforo real (55 / 20 s) cumple.
    cra23: 20
    dg15: 15
                       # Nota original: antes 10 s; 15 s = lapso de
                       # verde mas corto que el Manual (ed. 2004, 7.2.2.3) menciona como eficaz. Los peatones
                       # cuentan con el intervalo de 20 s de todo-rojo. El semaforo real (55 / 20 s) cumple.
  verde_max_s:          # ningun verde puede durar mas (evita que un eje espere indefinidamente)
    # Iteracion 4b (2026-10-26, decision de los autores): antes 60 s para ambos ejes. Ahora por eje: mas margen para la
    # via principal (Cra 23, ~70 % del trafico) y menos para la secundaria. Ciclo maximo = 70+3+0+25+3+20 = 121 s.
    # Manual 2024 (cap. 4, ciclos): 60-120 s recomendado; > 120 s solo en circunstancias particulares y periodos cortos
    # (pico); no se recomiendan > 150 s; con paso peatonal exclusivo no se recomiendan > 100 s (aqui los peatones
    # cruzan en el todo-rojo de 20 s; el semaforo real ya opera con 101 s) -> se discute como limitacion.
    cra23: 70
    dg15: 25
  amarillo_s: 3        # siempre completo
  todo_rojo_s:          # todo-rojo que sigue al verde de cada eje (OBSERVADO en campo, 2026-10-20)
    cra23: 0           # Cra 23 -> Dg 15: la Diagonal pasa a verde de inmediato
    dg15: 20           # Dg 15 -> Cra 23: ~22 s observados (19-22 s segun las sumas de rojo);
                       # se usa 20 s -> ciclo 55+3+0+20+3+20 = 101 s (medido: 100-103 s)
  eje_inicial: "dg15"  # eje que arranca en verde

# Perfil "norma": igual a "seguridad" salvo lo que se indica aqui. Lo usan el AGENTE (entrenamiento y evaluacion)
# y la referencia "tiempos_fijos_norma". El semaforo real ("tiempos_fijos") usa "seguridad" tal cual.
# Motivo: Manual 2024, 4.4.4 (tiempo de seguridad). Estimacion propia con la formula del Manual y la geometria de la
# red: ~4.4-5.2 s despues del verde de la Cra 23; hoy es 3 s (solo amarillo). Con 2 s de todo-rojo queda en 5 s.
# Comparacion conservadora: el agente cumple la norma aunque pierda 2 s por ciclo frente al semaforo real.
seguridad_norma:
  todo_rojo_s:
    cra23: 2
    dg15: 20

tiempos_fijos:
  verde_s:
    cra23: 55   # MEDIDO en campo (2026-10-20)
    dg15: 20    # MEDIDO en campo (2026-10-20)
